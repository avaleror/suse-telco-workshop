# Lab 06: Fleet delivers the site console to every cluster labelled
# demo=true and site-type=downstream. Apply on the management cluster.
# Selectors inside the repo's fleet.yaml do not apply: these targets win.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: telco-site-console
  namespace: fleet-default
spec:
  # Gitea on mgmt. rodeo copies github.com/avaleror/telco-site-console there
  # at deploy time, so Fleet needs no internet during the lab.
  repo: http://192.168.122.10:3000/gitea/telco-site-console.git
  branch: main
  targets:
    - clusterSelector:
        matchLabels:
          demo: "true"
          site-type: downstream
