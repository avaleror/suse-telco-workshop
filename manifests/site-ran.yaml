# site-ran-01, one host. Source: telco-examples release-3.7 (e4ec0b0), clusterclass instance.
# Same shape as example-clusterclass in namespace northline.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: site-ran-01
  namespace: northline
  labels:
    cluster-api.cattle.io/rancher-auto-import: "true"
spec:
  topology:
    classRef:
      name: example-clusterclass
      namespace: northline
    version: v1.36.3+rke2r1
    controlPlane:
      replicas: 1
    variables:
    - name: controlPlaneMachineTemplate
      value: site-ran-01-machinetemplate
    - name: controlPlaneEndpointHost
      value: 192.168.125.22
    - name: tlsSan
      value:
      - 192.168.125.22
      - https://192.168.125.22.sslip.io
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: site-ran-01-machinetemplate
  namespace: northline
spec:
  nodeReuse: true
  template:
    spec:
      automatedCleaningMode: metadata
      dataTemplate:
        name: site-ran-01
      hostSelector:
        matchLabels:
          cluster-role: control-plane
          deploy-region: northline
          cluster-type: site-ran
      image:
        checksum: http://imagecache.local:8080/eibimage-downstream-cluster.raw.sha256
        checksumType: sha256
        diskFormat: raw
        url: http://imagecache.local:8080/eibimage-downstream-cluster.raw
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3DataTemplate
metadata:
  name: site-ran-01
  namespace: northline
spec:
  clusterName: site-ran-01
  metaData:
    objectNames:
    - key: name
      object: machine
    - key: local-hostname
      object: machine
