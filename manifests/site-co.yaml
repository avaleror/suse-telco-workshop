# site-co-01, the central office: three control-plane nodes on site-co,
# site-co-2 and site-co-3. Source: telco-examples release-3.7 (e4ec0b0), DHCP
# quickstart objects, with SR-IOV removed and Metal3DataTemplate metaData only.
# The VIP, registration and files block follow the SUSE Telco Cloud 3.7 guide,
# "Downstream cluster provisioning with Directed network provisioning
# (multi-node)", MetalLB as the load balancer. Its ingress VIP pool for Traefik
# is left out: the labs reach the sites on NodePorts.
# The API sits on 192.168.122.20, a MetalLB address, and the files block below
# ships MetalLB, endpoint-copier and SUSE Storage with the cluster, the same way
# example-clusterclass does for site-ran-01.
# Image: the one downstream image rodeo builds for every site (SL Micro 6.2 Base, no RT kernel).
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: site-co-01
  namespace: default
  labels:
    cluster-api.cattle.io/rancher-auto-import: "true"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/18
    services:
      cidrBlocks:
      - 10.96.0.0/12
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: RKE2ControlPlane
    name: site-co-01
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: Metal3Cluster
    name: site-co-01
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3Cluster
metadata:
  name: site-co-01
  namespace: default
spec:
  controlPlaneEndpoint:
    host: 192.168.122.20
    port: 6443
  cloudProviderEnabled: false
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: RKE2ControlPlane
metadata:
  name: site-co-01
  namespace: default
  annotations:
    # Telco Cloud 3.7, multi-node chapter: lets MetalLB drop a node from the
    # API VIP while Cluster API drains it.
    rke2.controlplane.cluster.x-k8s.io/load-balancer-exclusion: "true"
spec:
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: site-co-01-controlplane
  replicas: 3
  version: v1.36.3+rke2r1
  rolloutStrategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 0
  registrationMethod: "control-plane-endpoint"
  registrationAddress: 192.168.122.20
  serverConfig:
    cni: cilium
    cniMultusEnable: true
    tlsSan:
    - 192.168.122.20
    - https://192.168.122.20.sslip.io
  agentConfig:
    format: ignition
    additionalUserData:
      config: |
        variant: fcos
        version: 1.4.0
        storage:
          files:
            # Multus next to Cilium (cniMultusEnable above).
            - path: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChartConfig
                  metadata:
                    name: rke2-cilium
                    namespace: kube-system
                  spec:
                    valuesContent: |-
                      cni:
                        exclusive: false
            - path: /var/lib/rancher/rke2/server/manifests/endpoint-copier-operator.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChart
                  metadata:
                    name: endpoint-copier-operator
                    namespace: kube-system
                  spec:
                    chart: oci://registry.suse.com/edge/charts/endpoint-copier-operator
                    targetNamespace: endpoint-copier-operator
                    version: 307.0.1+up0.3.0
                    createNamespace: true
            - path: /var/lib/rancher/rke2/server/manifests/metallb.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChart
                  metadata:
                    name: metallb
                    namespace: kube-system
                  spec:
                    chart: oci://registry.suse.com/edge/charts/metallb
                    targetNamespace: metallb-system
                    version: 307.0.3+up0.16.1
                    createNamespace: true
            - path: /var/lib/rancher/rke2/server/manifests/metallb-cr.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: metallb.io/v1beta1
                  kind: IPAddressPool
                  metadata:
                    name: kubernetes-vip-ip-pool
                    namespace: metallb-system
                  spec:
                    addresses:
                      - 192.168.122.20/32
                    serviceAllocation:
                      priority: 100
                      namespaces:
                        - default
                      serviceSelectors:
                        - matchExpressions:
                          - {key: "serviceType", operator: In, values: [kubernetes-vip]}
                  ---
                  apiVersion: metallb.io/v1beta1
                  kind: L2Advertisement
                  metadata:
                    name: ip-pool-l2-adv
                    namespace: metallb-system
                  spec:
                    ipAddressPools:
                      - kubernetes-vip-ip-pool
            - path: /var/lib/rancher/rke2/server/manifests/endpoint-svc.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: kubernetes-vip
                    namespace: default
                    labels:
                      serviceType: kubernetes-vip
                  spec:
                    ports:
                    - name: rke2-api
                      port: 9345
                      protocol: TCP
                      targetPort: 9345
                    - name: k8s-api
                      port: 6443
                      protocol: TCP
                      targetPort: 6443
                    type: LoadBalancer
            # SUSE Storage 1.12.1 with the cluster. Three replicas, one per node.
            # The site image already has open-iscsi and a running iscsid.
            - path: /var/lib/rancher/rke2/server/manifests/suse-storage.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChart
                  metadata:
                    name: longhorn
                    namespace: kube-system
                  spec:
                    repo: https://charts.longhorn.io
                    chart: longhorn
                    version: 1.12.1
                    targetNamespace: longhorn-system
                    createNamespace: true
                    valuesContent: |-
                      persistence:
                        defaultClassReplicaCount: 3
                      defaultSettings:
                        defaultReplicaCount: 3
        systemd:
          units:
            - name: rke2-preinstall.service
              enabled: true
              contents: |
                [Unit]
                Description=rke2-preinstall
                Wants=network-online.target
                Before=rke2-install.service
                ConditionPathExists=!/run/cluster-api/bootstrap-success.complete
                [Service]
                Type=oneshot
                User=root
                ExecStartPre=/bin/sh -c "mount -L config-2 /mnt"
                # Note we use _ as a delimiter for sed here because the providerid includes / characters
                ExecStart=/bin/sh -c "sed -i \"s_PROVIDERID_$(jq -r .providerid /mnt/openstack/latest/meta_data.json)_\" /etc/rancher/rke2/config.yaml"
                ExecStart=/bin/sh -c "echo \"node-name: $(jq -r .name /mnt/openstack/latest/meta_data.json)\" >> /etc/rancher/rke2/config.yaml"
                ExecStart=/bin/sh -c "echo \"node-label:\" >> /etc/rancher/rke2/config.yaml"
                ExecStart=/bin/sh -c "echo \"  - metal3.io/uuid=$(jq -r .uuid /mnt/openstack/latest/meta_data.json)\" >> /etc/rancher/rke2/config.yaml"
                ExecStartPost=/bin/sh -c "umount /mnt"
                [Install]
                WantedBy=multi-user.target
    kubelet:
      extraArgs:
      - provider-id=metal3://PROVIDERID
    nodeName: "localhost.localdomain"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: site-co-01-controlplane
  namespace: default
spec:
  template:
    spec:
      dataTemplate:
        name: site-co-01-controlplane-template
      hostSelector:
        matchLabels:
          cluster-role: control-plane
          site: site-co
      image:
        checksum: http://imagecache.local:8080/eibimage-downstream-cluster.raw.sha256
        checksumType: sha256
        diskFormat: raw
        url: http://imagecache.local:8080/eibimage-downstream-cluster.raw
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3DataTemplate
metadata:
  name: site-co-01-controlplane-template
  namespace: default
spec:
  clusterName: site-co-01
  metaData:
    objectNames:
    - key: name
      object: machine
    - key: local-hostname
      object: machine
    - key: local_hostname
      object: machine
