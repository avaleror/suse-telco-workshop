name: Deploy docs to GitHub Pages

# Same job as the edge workshop: mkdocs gh-deploy.
# Push stays off while this repo is private. This file does not change visibility.
# Turn the push trigger on when the site should be visible.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdocs gh-deploy --force
